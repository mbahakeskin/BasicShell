[package]
name = "wpe-webkit"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Rust bindings for WPE WebKit 2.54, generated by gir"

[dependencies]
ffi = { package = "wpe-webkit-sys", path = "../sys/wpe-webkit-sys", features = ["v2_54"] }
wpe-platform = { path = "../wpe-platform" }
glib = "0.22"
gio = "0.22"
soup = { package = "soup3", version = "0.9" }
libc = "0.2"
bitflags = "2"
