[package]
name = "wpe-platform"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Rust bindings for WPEPlatform (WPE WebKit 2.54), generated by gir"

[dependencies]
ffi = { package = "wpe-platform-sys", path = "../sys/wpe-platform-sys", features = ["v2_54"] }
glib = "0.22"
gio = "0.22"
libc = "0.2"
bitflags = "2"
