[package]
name = "wpe-javascriptcore-sys"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "FFI bindings, generated by gir from WPE WebKit 2.54"
build = "build.rs"

[package.metadata.system-deps.wpe_javascriptcore_2_0]
name = "wpe-webkit-2.0"
version = "2"

[package.metadata.system-deps.wpe_javascriptcore_2_0.v2_24]
version = "2.24"

[package.metadata.system-deps.wpe_javascriptcore_2_0.v2_28]
version = "2.28"

[package.metadata.system-deps.wpe_javascriptcore_2_0.v2_38]
version = "2.38"

[package.metadata.system-deps.wpe_javascriptcore_2_0.v2_48]
version = "2.48"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[lib]
name = "wpe_java_script_core_sys"

[dependencies]
libc = "0.2"

[dependencies.glib-sys]
version = "0.22"

[dependencies.gobject-sys]
version = "0.22"

[build-dependencies]
system-deps = "9"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
v2_24 = []
v2_28 = ["v2_24"]
v2_38 = ["v2_28"]
v2_48 = ["v2_38"]
