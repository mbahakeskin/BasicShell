[package]
name = "wpe-platform-wayland-sys"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "FFI bindings, generated by gir from WPE WebKit 2.54"
build = "build.rs"

[package.metadata.system-deps.wpe_platform_wayland_2_0]
name = "wpe-platform-wayland-2.0"
version = "2"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[lib]
name = "wpe_platform_wayland_sys"

[dependencies]
libc = "0.2"

[dependencies.glib-sys]
version = "0.22"

[dependencies.gobject-sys]
version = "0.22"

[dependencies.gio-sys]
version = "0.22"

[dependencies.wpe_platform-sys]
package = "wpe-platform-sys"
path = "../wpe-platform-sys"

[build-dependencies]
system-deps = "9"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
