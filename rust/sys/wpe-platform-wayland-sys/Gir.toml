[options]
library = "WPEPlatformWayland"
version = "2.0"
min_cfg_version = "2.0"
target_path = "."
work_mode = "sys"
girs_directories = ["../../gir-files", "../../../build/gir-files"]
single_version_file = true
external_libraries = ["GLib", "GObject", "Gio", "WPEPlatform"]

# They hand out libwayland-client's own types, which gir doesn't know.
[[object]]
name = "WPEPlatformWayland.DisplayWayland"
status = "generate"
    [[object.function]]
    pattern = "get_wl_.*"
    ignore = true

[[object]]
name = "WPEPlatformWayland.ScreenWayland"
status = "generate"
    [[object.function]]
    pattern = "get_wl_.*"
    ignore = true

[[object]]
name = "WPEPlatformWayland.ToplevelWayland"
status = "generate"
    [[object.function]]
    pattern = "get_wl_.*"
    ignore = true

[[object]]
name = "WPEPlatformWayland.ViewWayland"
status = "generate"
    [[object.function]]
    pattern = "get_wl_.*"
    ignore = true
