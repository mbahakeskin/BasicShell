[package]
name = "wpe-javascriptcore"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Rust bindings for WPE WebKit 2.54's JavaScriptCore, generated by gir"

[dependencies]
ffi = { package = "wpe-javascriptcore-sys", path = "../sys/wpe-javascriptcore-sys", features = ["v2_48"] }
glib = "0.22"
libc = "0.2"
bitflags = "2"
